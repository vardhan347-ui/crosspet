<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=Instrument+Serif&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #1A1A1A; } a:hover { color: #8A6A00; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F6F6F6; color: #1A1A1A;">

  <!-- header -->
  <div style="display: flex; align-items: center; gap: 12px; padding: 26px 20px 0;">
    <div style="flex-grow: 1;">
      <div style="font-size: 17px; font-weight: 500; letter-spacing: -0.01em;">Hi Anna</div>
      <div style="margin-top: 2px; font-size: 12.5px; font-weight: 400; color: #8A8A8A;">Sat, 22 Aug</div>
    </div>
    <div style="position: relative; flex-shrink: 0; width: 46px; height: 46px; border-radius: 14px; background: #FFFFFF; border: 1px solid #EAEAEA; display: flex; align-items: center; justify-content: center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5"></rect><path d="M4 7.5l8 5.5 8-5.5"></path></svg>
      <div style="position: absolute; top: 10px; right: 10px; width: 7px; height: 7px; border-radius: 4px; background: #EF4444; border: 1.5px solid #FFFFFF;"></div>
    </div>
  </div>

  <!-- hero objects -->
  <div style="margin: 14px 0 0;">
    <svg viewBox="0 0 390 156" width="390" height="156">
      <defs>
        <linearGradient id="tAmber" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#FFD25E"></stop><stop offset="52%" stop-color="#F7B500"></stop><stop offset="100%" stop-color="#C98F00"></stop></linearGradient>
        <linearGradient id="tSteel" x1="0" y1="0" x2="0.7" y2="1"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="55%" stop-color="#E6E6E6"></stop><stop offset="100%" stop-color="#BFBFBF"></stop></linearGradient>
        <linearGradient id="tDark" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#4A4A4A"></stop><stop offset="100%" stop-color="#1E1E1E"></stop></linearGradient>
      </defs>

      <!-- shaker -->
      <ellipse cx="96" cy="140" rx="34" ry="7" fill="#1A1A1A" opacity="0.07"></ellipse>
      <path d="M74 60 h44 v72 a10 10 0 0 1 -10 10 h-24 a10 10 0 0 1 -10 -10z" fill="url(#tAmber)"></path>
      <rect x="74" y="86" width="44" height="16" fill="#FFFFFF" opacity="0.72"></rect>
      <rect x="78" y="44" width="36" height="18" rx="5" fill="url(#tDark)"></rect>
      <ellipse cx="96" cy="44" rx="18" ry="5" fill="#5A5A5A"></ellipse>
      <rect x="80" y="66" width="6" height="60" rx="3" fill="#FFFFFF" opacity="0.3"></rect>

      <!-- bowl -->
      <ellipse cx="196" cy="142" rx="52" ry="8" fill="#1A1A1A" opacity="0.07"></ellipse>
      <path d="M148 92 h96 a7 7 0 0 1 7 7 a55 40 0 0 1 -110 0 a7 7 0 0 1 7 -7z" fill="url(#tAmber)"></path>
      <ellipse cx="196" cy="92" rx="55" ry="16" fill="#E4E4E4"></ellipse>
      <ellipse cx="196" cy="93" rx="47" ry="13" fill="#FFF7E4"></ellipse>
      <circle cx="176" cy="90" r="8" fill="#E05A45"></circle>
      <circle cx="212" cy="95" r="6" fill="#E05A45"></circle>
      <path d="M190 84 C 202 78, 218 81, 224 87 C 213 93, 197 91, 190 84z" fill="#7FA24E"></path>
      <path d="M164 96 C 173 90, 186 92, 191 98 C 181 103, 169 102, 164 96z" fill="#9CBB63"></path>

      <!-- scale -->
      <ellipse cx="300" cy="142" rx="42" ry="7" fill="#1A1A1A" opacity="0.07"></ellipse>
      <path d="M262 112 h76 a6 6 0 0 1 6 6 v14 a6 6 0 0 1 -6 6 h-76 a6 6 0 0 1 -6 -6 v-14 a6 6 0 0 1 6 -6z" fill="url(#tDark)"></path>
      <rect x="266" y="118" width="26" height="12" rx="3" fill="#2BD07A"></rect>
      <circle cx="330" cy="124" r="4" fill="#F7B500"></circle>
      <path d="M268 84 h64 a8 8 0 0 1 8 8 v12 a8 8 0 0 1 -8 8 h-64 a8 8 0 0 1 -8 -8 v-12 a8 8 0 0 1 8 -8z" fill="url(#tSteel)"></path>
      <ellipse cx="300" cy="84" rx="40" ry="10" fill="#F2F2F2"></ellipse>
      <ellipse cx="300" cy="82" rx="30" ry="7" fill="url(#tAmber)"></ellipse>
    </svg>
  </div>

  <!-- status card -->
  <div style="margin: 14px 20px 0; padding: 16px; border-radius: 18px; background: #FFFFFF; border: 1px solid #EFEFEF; box-shadow: 0 4px 14px rgba(0,0,0,0.035);">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 11px; border-radius: 9px; border: 1px solid #EAEAEA;">
        <div style="width: 4px; height: 13px; border-radius: 2px; background: #22C55E;"></div>
        <div style="font-size: 13px; font-weight: 500;">On track</div>
      </div>
      <div style="flex-grow: 1;"></div>
      <div style="display: flex; align-items: center; justify-content: center; height: 34px; padding: 0 18px; border-radius: 10px; background: {{accent}}; font-size: 13.5px; font-weight: 600;">Log meal</div>
    </div>

    <div style="display: flex; gap: 12px; margin-top: 18px;">
      <div style="flex-grow: 1; flex-basis: 0;">
        <div style="font-size: 12.5px; font-weight: 400; color: #8A8A8A;">Eaten</div>
        <div style="display: flex; align-items: baseline; gap: 4px; margin-top: 2px;">
          <div style="font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 33px; line-height: 1;">1,558</div>
          <div style="font-size: 11.5px; font-weight: 400; color: #8A8A8A;">/2,300</div>
        </div>
      </div>
      <div style="flex-grow: 1; flex-basis: 0;">
        <div style="font-size: 12.5px; font-weight: 400; color: #8A8A8A;">Remaining</div>
        <div style="display: flex; align-items: baseline; gap: 4px; margin-top: 2px;">
          <div style="font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 33px; line-height: 1;">742</div>
          <div style="font-size: 11.5px; font-weight: 400; color: #8A8A8A;">/kcal</div>
        </div>
      </div>
      <div style="flex-grow: 1; flex-basis: 0;">
        <div style="font-size: 12.5px; font-weight: 400; color: #8A8A8A;">Protein</div>
        <div style="display: flex; align-items: baseline; gap: 4px; margin-top: 2px;">
          <div style="font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 33px; line-height: 1;">96</div>
          <div style="font-size: 11.5px; font-weight: 400; color: #8A8A8A;">g</div>
        </div>
      </div>
    </div>
  </div>

  <div style="margin: 22px 20px 0; font-size: 16px; font-weight: 500; letter-spacing: -0.01em;">Today's Meals</div>

  <!-- meal grid -->
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 12px 20px 0;">

    <div style="padding: 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #EFEFEF; box-shadow: 0 4px 14px rgba(0,0,0,0.035);">
      <div style="display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 9px; border-radius: 8px; border: 1px solid #EAEAEA;">
        <div style="width: 3.5px; height: 11px; border-radius: 2px; background: #22C55E;"></div>
        <div style="font-size: 11.5px; font-weight: 500;">Logged</div>
      </div>
      <div style="display: flex; justify-content: center; margin-top: 8px;">
        <svg viewBox="0 0 120 76" width="120" height="76">
          <ellipse cx="60" cy="68" rx="34" ry="5" fill="#1A1A1A" opacity="0.07"></ellipse>
          <path d="M28 34 h64 a5 5 0 0 1 5 5 a37 27 0 0 1 -74 0 a5 5 0 0 1 5 -5z" fill="#F0F0F0"></path>
          <ellipse cx="60" cy="34" rx="37" ry="11" fill="#E0E0E0"></ellipse>
          <ellipse cx="60" cy="35" rx="31" ry="8.5" fill="#F6EFDC"></ellipse>
          <circle cx="48" cy="33" r="5" fill="#5D74D8"></circle>
          <circle cx="70" cy="36" r="4" fill="#5D74D8"></circle>
          <path d="M58 29 C 66 25, 76 27, 80 32 C 72 36, 62 34, 58 29z" fill="#F7B500"></path>
        </svg>
      </div>
      <div style="margin-top: 8px; font-size: 12.5px; font-weight: 400; color: #8A8A8A;">Breakfast</div>
      <div style="margin-top: 1px; font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 24px; line-height: 1.15;">Overnight Oats</div>
    </div>

    <div style="padding: 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #EFEFEF; box-shadow: 0 4px 14px rgba(0,0,0,0.035);">
      <div style="display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 9px; border-radius: 8px; border: 1px solid #EAEAEA;">
        <div style="width: 3.5px; height: 11px; border-radius: 2px; background: #22C55E;"></div>
        <div style="font-size: 11.5px; font-weight: 500;">Logged</div>
      </div>
      <div style="display: flex; justify-content: center; margin-top: 8px;">
        <svg viewBox="0 0 120 76" width="120" height="76">
          <ellipse cx="60" cy="68" rx="36" ry="5" fill="#1A1A1A" opacity="0.07"></ellipse>
          <path d="M25 32 h70 a5 5 0 0 1 5 5 a40 29 0 0 1 -80 0 a5 5 0 0 1 5 -5z" fill="#F7B500"></path>
          <ellipse cx="60" cy="32" rx="40" ry="12" fill="#E4E4E4"></ellipse>
          <ellipse cx="60" cy="33" rx="34" ry="9" fill="#FFF7E4"></ellipse>
          <rect x="60" y="24" width="22" height="8" rx="4" fill="#C97F4A" transform="rotate(-10 71 28)"></rect>
          <rect x="58" y="34" width="22" height="8" rx="4" fill="#D98F58" transform="rotate(6 69 38)"></rect>
          <ellipse cx="42" cy="34" rx="11" ry="5" fill="#7FA24E" transform="rotate(-10 42 34)"></ellipse>
          <circle cx="52" cy="27" r="4.5" fill="#E05A45"></circle>
        </svg>
      </div>
      <div style="margin-top: 8px; font-size: 12.5px; font-weight: 400; color: #8A8A8A;">Lunch</div>
      <div style="margin-top: 1px; font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 24px; line-height: 1.15;">Chicken Bowl</div>
    </div>

    <div style="padding: 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #EFEFEF; box-shadow: 0 4px 14px rgba(0,0,0,0.035);">
      <div style="display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 9px; border-radius: 8px; border: 1px solid #EAEAEA;">
        <div style="width: 3.5px; height: 11px; border-radius: 2px; background: #22C55E;"></div>
        <div style="font-size: 11.5px; font-weight: 500;">Logged</div>
      </div>
      <div style="display: flex; justify-content: center; margin-top: 8px;">
        <svg viewBox="0 0 120 76" width="120" height="76">
          <ellipse cx="60" cy="68" rx="28" ry="5" fill="#1A1A1A" opacity="0.07"></ellipse>
          <circle cx="60" cy="42" r="22" fill="#E05A45"></circle>
          <path d="M60 20 c8 -12, 20 -13, 26 -9 c-5 10, -15 13, -26 9z" fill="#7FA24E"></path>
          <ellipse cx="52" cy="34" rx="6" ry="4" fill="#FFFFFF" opacity="0.34" transform="rotate(-24 52 34)"></ellipse>
        </svg>
      </div>
      <div style="margin-top: 8px; font-size: 12.5px; font-weight: 400; color: #8A8A8A;">Snack</div>
      <div style="margin-top: 1px; font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 24px; line-height: 1.15;">Apple &amp; Nuts</div>
    </div>

    <div style="padding: 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #EFEFEF; box-shadow: 0 4px 14px rgba(0,0,0,0.035);">
      <div style="display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 9px; border-radius: 8px; border: 1px solid #EAEAEA;">
        <div style="width: 3.5px; height: 11px; border-radius: 2px; background: #EF4444;"></div>
        <div style="font-size: 11.5px; font-weight: 500;">Planned</div>
      </div>
      <div style="display: flex; justify-content: center; margin-top: 8px;">
        <svg viewBox="0 0 120 76" width="120" height="76">
          <ellipse cx="60" cy="68" rx="32" ry="5" fill="#1A1A1A" opacity="0.07"></ellipse>
          <path d="M30 30 h60 a5 5 0 0 1 5 5 a35 26 0 0 1 -70 0 a5 5 0 0 1 5 -5z" fill="#DCDCDC"></path>
          <ellipse cx="60" cy="30" rx="35" ry="10" fill="#EDEDED"></ellipse>
          <ellipse cx="60" cy="31" rx="29" ry="7.5" fill="#F7F7F7"></ellipse>
        </svg>
      </div>
      <div style="margin-top: 8px; font-size: 12.5px; font-weight: 400; color: #8A8A8A;">Dinner</div>
      <div style="margin-top: 1px; font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 24px; line-height: 1.15;">Not logged</div>
    </div>

  </div>

  <!-- bottom nav -->
  <div style="position: absolute; left: 50%; transform: translateX(-50%); bottom: 24px; height: 66px; padding: 0 8px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 10px 28px rgba(0,0,0,0.12); display: flex; align-items: center; gap: 4px;">
    <div style="display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 18px 0 10px; border-radius: 16px; background: #222222;">
      <div style="width: 32px; height: 32px; border-radius: 11px; background: #3A3A3A; display: flex; align-items: center; justify-content: center;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V19a1 1 0 01-1 1H5a1 1 0 01-1-1z"></path></svg>
      </div>
      <div style="font-size: 14.5px; font-weight: 500; color: #FFFFFF;">Today</div>
    </div>
    <div style="width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.7" stroke-linecap="round"><path d="M6 19v-6M12 19V6M18 19v-9"></path></svg>
    </div>
    <div style="width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
    </div>
    <div style="width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.6"></circle><path d="M5.5 19.5a6.5 6.5 0 0113 0"></path></svg>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#F7B500","options":["#F7B500","#1A1A1A","#22C55E","#5D74D8"],"section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#F7B500' };
  }
}
</script>
</body>
</html>
