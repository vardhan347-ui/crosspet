<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=Instrument+Serif&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #1A1A1A; } a:hover { color: #8A6A00; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F6F6F6; color: #1A1A1A;">

  <!-- header -->
  <div style="display: flex; align-items: center; gap: 12px; padding: 26px 20px 0;">
    <div style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid #EAEAEA; display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </div>
    <div style="flex-grow: 1; text-align: center; font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 22px; line-height: 1.1;">Journal</div>
    <div style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid #EAEAEA; display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"></rect><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"></path></svg>
    </div>
  </div>

  <!-- day strip -->
  <div style="display: flex; gap: 6px; margin: 20px 20px 0;">
    <div style="flex-grow: 1; flex-basis: 0; height: 62px; border-radius: 14px; background: #FFFFFF; border: 1px solid #EFEFEF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <div style="font-size: 10.5px; font-weight: 400; color: #8A8A8A;">Sun</div>
      <div style="font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 18px; line-height: 1;">16</div>
    </div>
    <div style="flex-grow: 1; flex-basis: 0; height: 62px; border-radius: 14px; background: #FFFFFF; border: 1px solid #EFEFEF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <div style="font-size: 10.5px; font-weight: 400; color: #8A8A8A;">Mon</div>
      <div style="font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 18px; line-height: 1;">17</div>
    </div>
    <div style="flex-grow: 1; flex-basis: 0; height: 62px; border-radius: 14px; background: #FFFFFF; border: 1px solid #EFEFEF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <div style="font-size: 10.5px; font-weight: 400; color: #8A8A8A;">Tue</div>
      <div style="font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 18px; line-height: 1;">18</div>
    </div>
    <div style="flex-grow: 1; flex-basis: 0; height: 62px; border-radius: 14px; background: #FFFFFF; border: 1px solid #EFEFEF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <div style="font-size: 10.5px; font-weight: 400; color: #8A8A8A;">Wed</div>
      <div style="font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 18px; line-height: 1;">19</div>
    </div>
    <div style="flex-grow: 1; flex-basis: 0; height: 62px; border-radius: 14px; background: #FFFFFF; border: 1px solid #EFEFEF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <div style="font-size: 10.5px; font-weight: 400; color: #8A8A8A;">Thu</div>
      <div style="font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 18px; line-height: 1;">20</div>
    </div>
    <div style="flex-grow: 1; flex-basis: 0; height: 62px; border-radius: 14px; background: #FFFFFF; border: 1px solid #EFEFEF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <div style="font-size: 10.5px; font-weight: 400; color: #8A8A8A;">Fri</div>
      <div style="font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 18px; line-height: 1;">21</div>
    </div>
    <div style="flex-grow: 1; flex-basis: 0; height: 62px; border-radius: 14px; background: #222222; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <div style="font-size: 10.5px; font-weight: 400; color: rgba(255,255,255,0.62);">Sat</div>
      <div style="font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 18px; line-height: 1; color: #FFFFFF;">22</div>
    </div>
  </div>

  <!-- day header -->
  <div style="display: flex; align-items: center; gap: 12px; margin: 22px 20px 0;">
    <div style="flex-grow: 1; font-size: 16px; font-weight: 500; letter-spacing: -0.01em;">Saturday, 22 Aug</div>
    <div style="display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 10px; border-radius: 9px; background: #FFFFFF; border: 1px solid #EAEAEA;">
      <div style="width: 3.5px; height: 12px; border-radius: 2px; background: #22C55E;"></div>
      <div style="font-size: 12px; font-weight: 500;">68% of goal</div>
    </div>
  </div>

  <!-- progress card -->
  <div style="margin: 12px 20px 0; padding: 16px; border-radius: 18px; background: #FFFFFF; border: 1px solid #EFEFEF; box-shadow: 0 4px 14px rgba(0,0,0,0.035);">
    <div style="display: flex; gap: 12px;">
      <div style="flex-grow: 1; flex-basis: 0;">
        <div style="display: flex; align-items: baseline; gap: 4px;">
          <div style="font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 31px; line-height: 1;">3</div>
          <div style="font-size: 11.5px; font-weight: 400; color: #8A8A8A;">/5</div>
        </div>
        <div style="margin-top: 5px; font-size: 12.5px; font-weight: 400; color: #8A8A8A;">Meals</div>
        <div style="margin-top: 10px; height: 3px; border-radius: 2px; background: #22C55E;"></div>
      </div>
      <div style="flex-grow: 1; flex-basis: 0;">
        <div style="display: flex; align-items: baseline; gap: 4px;">
          <div style="font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 31px; line-height: 1;">1,558</div>
          <div style="font-size: 11.5px; font-weight: 400; color: #8A8A8A;">/2,300</div>
        </div>
        <div style="margin-top: 5px; font-size: 12.5px; font-weight: 400; color: #8A8A8A;">Calories</div>
        <div style="margin-top: 10px; height: 3px; border-radius: 2px; background: {{accent}};"></div>
      </div>
      <div style="flex-grow: 1; flex-basis: 0;">
        <div style="display: flex; align-items: baseline; gap: 4px;">
          <div style="font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 31px; line-height: 1;">1.4</div>
          <div style="font-size: 11.5px; font-weight: 400; color: #8A8A8A;">/2.2L</div>
        </div>
        <div style="margin-top: 5px; font-size: 12.5px; font-weight: 400; color: #8A8A8A;">Water</div>
        <div style="margin-top: 10px; height: 3px; border-radius: 2px; background: #EC4899;"></div>
      </div>
    </div>
  </div>

  <div style="margin: 18px 20px 0; font-size: 16px; font-weight: 500; letter-spacing: -0.01em;">Logged Today</div>

  <!-- entries -->
  <div style="display: flex; flex-direction: column; gap: 12px; margin: 12px 20px 0;">

    <div style="display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #EFEFEF; box-shadow: 0 4px 14px rgba(0,0,0,0.035);">
      <div style="flex-shrink: 0;">
        <svg viewBox="0 0 96 66" width="96" height="66">
          <ellipse cx="48" cy="58" rx="26" ry="4" fill="#1A1A1A" opacity="0.07"></ellipse>
          <path d="M22 28 h52 a4 4 0 0 1 4 4 a30 21 0 0 1 -60 0 a4 4 0 0 1 4 -4z" fill="#F0F0F0"></path>
          <ellipse cx="48" cy="28" rx="30" ry="9" fill="#E0E0E0"></ellipse>
          <ellipse cx="48" cy="29" rx="25" ry="7" fill="#F6EFDC"></ellipse>
          <circle cx="39" cy="27" r="4" fill="#5D74D8"></circle>
          <circle cx="56" cy="30" r="3.2" fill="#5D74D8"></circle>
          <path d="M46 24 C 53 21, 61 23, 64 27 C 58 30, 49 28, 46 24z" fill="#F7B500"></path>
        </svg>
      </div>
      <div style="flex-grow: 1;">
        <div style="font-size: 12.5px; font-weight: 400; color: #8A8A8A;">Breakfast &middot; 08:20</div>
        <div style="margin-top: 1px; font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 24px; line-height: 1.15;">Overnight Oats</div>
      </div>
      <div style="flex-shrink: 0; text-align: right;">
        <div style="font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 26px; line-height: 1;">412</div>
        <div style="margin-top: 3px; font-size: 11px; font-weight: 400; color: #8A8A8A;">kcal</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #EFEFEF; box-shadow: 0 4px 14px rgba(0,0,0,0.035);">
      <div style="flex-shrink: 0;">
        <svg viewBox="0 0 96 66" width="96" height="66">
          <ellipse cx="48" cy="58" rx="28" ry="4" fill="#1A1A1A" opacity="0.07"></ellipse>
          <path d="M20 26 h56 a4 4 0 0 1 4 4 a32 23 0 0 1 -64 0 a4 4 0 0 1 4 -4z" fill="#F7B500"></path>
          <ellipse cx="48" cy="26" rx="32" ry="10" fill="#E4E4E4"></ellipse>
          <ellipse cx="48" cy="27" rx="27" ry="7.5" fill="#FFF7E4"></ellipse>
          <rect x="48" y="19" width="18" height="7" rx="3.5" fill="#C97F4A" transform="rotate(-10 57 22)"></rect>
          <rect x="46" y="28" width="18" height="7" rx="3.5" fill="#D98F58" transform="rotate(6 55 31)"></rect>
          <ellipse cx="34" cy="28" rx="9" ry="4" fill="#7FA24E" transform="rotate(-10 34 28)"></ellipse>
          <circle cx="42" cy="22" r="3.6" fill="#E05A45"></circle>
        </svg>
      </div>
      <div style="flex-grow: 1;">
        <div style="font-size: 12.5px; font-weight: 400; color: #8A8A8A;">Lunch &middot; 12:40</div>
        <div style="margin-top: 1px; font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 24px; line-height: 1.15;">Chicken Bowl</div>
      </div>
      <div style="flex-shrink: 0; text-align: right;">
        <div style="font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 26px; line-height: 1;">613</div>
        <div style="margin-top: 3px; font-size: 11px; font-weight: 400; color: #8A8A8A;">kcal</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #EFEFEF; box-shadow: 0 4px 14px rgba(0,0,0,0.035);">
      <div style="flex-shrink: 0;">
        <svg viewBox="0 0 96 66" width="96" height="66">
          <ellipse cx="48" cy="58" rx="22" ry="4" fill="#1A1A1A" opacity="0.07"></ellipse>
          <circle cx="48" cy="34" r="18" fill="#E05A45"></circle>
          <path d="M48 16 c6 -10, 16 -11, 21 -7 c-4 8, -12 11, -21 7z" fill="#7FA24E"></path>
          <ellipse cx="41" cy="27" rx="5" ry="3" fill="#FFFFFF" opacity="0.34" transform="rotate(-24 41 27)"></ellipse>
        </svg>
      </div>
      <div style="flex-grow: 1;">
        <div style="font-size: 12.5px; font-weight: 400; color: #8A8A8A;">Snack &middot; 16:05</div>
        <div style="margin-top: 1px; font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 24px; line-height: 1.15;">Apple &amp; Nuts</div>
      </div>
      <div style="flex-shrink: 0; text-align: right;">
        <div style="font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 26px; line-height: 1;">248</div>
        <div style="margin-top: 3px; font-size: 11px; font-weight: 400; color: #8A8A8A;">kcal</div>
      </div>
    </div>

  </div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin: 12px 20px 0; height: 66px; border-radius: 18px; border: 1.5px dashed #DCDCDC;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    <div style="font-size: 14.5px; font-weight: 500; color: #8A8A8A;">Log dinner</div>
  </div>

  <!-- bottom nav -->
  <div style="position: absolute; left: 50%; transform: translateX(-50%); bottom: 24px; height: 66px; padding: 0 8px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 10px 28px rgba(0,0,0,0.12); display: flex; align-items: center; gap: 4px;">
    <div style="width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V19a1 1 0 01-1 1H5a1 1 0 01-1-1z"></path></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 18px 0 10px; border-radius: 16px; background: #222222;">
      <div style="width: 32px; height: 32px; border-radius: 11px; background: #3A3A3A; display: flex; align-items: center; justify-content: center;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round"><path d="M6 19v-6M12 19V6M18 19v-9"></path></svg>
      </div>
      <div style="font-size: 14.5px; font-weight: 500; color: #FFFFFF;">Journal</div>
    </div>
    <div style="width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
    </div>
    <div style="width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.6"></circle><path d="M5.5 19.5a6.5 6.5 0 0113 0"></path></svg>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#F7B500","options":["#F7B500","#1A1A1A","#22C55E","#5D74D8"],"section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#F7B500' };
  }
}
</script>
</body>
</html>
