<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #365DF5; } a:hover { color: #162150; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #E9EEF8; color: #162150;">

  <!-- hero -->
  <div style="position: relative; height: 300px; border-radius: 0 0 30px 30px; overflow: hidden; background: linear-gradient(170deg, #CFE0FF 0%, #E4EDFF 58%, #F2F6FF 100%);">
    <svg viewBox="0 0 390 300" width="390" height="300" style="position: absolute; left: 0; bottom: 0;">
      <circle cx="300" cy="96" r="62" fill="#FFFFFF" opacity="0.42"></circle>
      <circle cx="66" cy="52" r="30" fill="#FFFFFF" opacity="0.3"></circle>
      <path d="M0 246 Q 96 216 196 240 T 390 236 L390 300 L0 300z" fill="#DDE7FB"></path>
      <path d="M0 268 Q 120 246 250 266 T 390 262 L390 300 L0 300z" fill="#F4F7FE"></path>
      <!-- leaves -->
      <path d="M44 268 C 26 252, 26 226, 46 214 C 60 232, 60 254, 44 268z" fill="#C9D48A"></path>
      <path d="M60 270 C 74 250, 98 244, 110 254 C 98 272, 76 278, 60 270z" fill="#DCE0A6"></path>
      <!-- glass of water -->
      <path d="M300 214 h40 l-5 60 h-30z" fill="#E3ECFF"></path>
      <path d="M302 236 h36 l-3 38 h-30z" fill="#6792FF" opacity="0.75"></path>
      <!-- apple -->
      <circle cx="256" cy="252" r="24" fill="#FA644C"></circle>
      <path d="M256 230 c8 -12, 20 -14, 26 -10 c-4 10, -14 14, -26 10z" fill="#C9D48A"></path>
      <!-- bowl -->
      <path d="M120 230 h130 a10 10 0 0 1 10 10 a75 40 0 0 1 -150 0 a10 10 0 0 1 10 -10z" fill="#365DF5"></path>
      <ellipse cx="185" cy="230" rx="75" ry="20" fill="#6792FF"></ellipse>
      <ellipse cx="185" cy="230" rx="66" ry="16" fill="#FFF6E2"></ellipse>
      <circle cx="156" cy="228" r="10" fill="#FA644C"></circle>
      <circle cx="212" cy="232" r="8" fill="#FA644C"></circle>
      <path d="M176 220 C 190 212, 210 216, 216 224 C 202 232, 184 230, 176 220z" fill="#C9D48A"></path>
      <path d="M148 236 C 158 228, 174 230, 180 238 C 168 244, 154 243, 148 236z" fill="#DCE0A6"></path>
      <ellipse cx="185" cy="274" rx="62" ry="7" fill="#162150" opacity="0.07"></ellipse>
    </svg>

    <div style="position: relative; display: flex; align-items: center; gap: 12px; padding: 26px 20px 0;">
      <div style="flex-grow: 1;">
        <div style="font-size: 13px; font-weight: 500; color: #5E6E96;">Saturday, 22 August</div>
        <div style="margin-top: 3px; font-size: 25px; font-weight: 800; letter-spacing: -0.025em;">Good morning, Anna</div>
      </div>
      <div style="flex-shrink: 0; width: 46px; height: 46px; border-radius: 23px; background: #365DF5; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; color: #FFFFFF;">A</div>
    </div>
  </div>

  <!-- quick log bar -->
  <div style="position: relative; margin: -34px 20px 0; height: 66px; border-radius: 20px; background: #FFFFFF; box-shadow: 0 10px 26px rgba(22,33,80,0.10); display: flex; align-items: center; gap: 14px; padding: 0 18px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
    <div>
      <div style="font-size: 15px; font-weight: 700; letter-spacing: -0.01em;">Log a meal</div>
      <div style="margin-top: 2px; font-size: 12px; font-weight: 500; color: #7A88AB;">Search &middot; Scan &middot; Recent</div>
    </div>
  </div>

  <!-- categories -->
  <div style="display: flex; margin-top: 26px; padding: 0 16px;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#162150" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15.5h16a8 8 0 01-16 0z"></path><path d="M3 19.5h18"></path><path d="M9 4.5c-1.2 1-1.2 2.2 0 3.2s1.2 2.2 0 3.2M14.5 5.5c-1 .8-1 1.8 0 2.6s1 1.8 0 2.6"></path></svg>
      <div style="font-size: 12px; font-weight: 500; color: #5E6E96;">Breakfast</div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#162150" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="3.5"></circle></svg>
      <div style="font-size: 12px; font-weight: 500; color: #5E6E96;">Lunch</div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#162150" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5v8a2.5 2.5 0 005 0v-8M8.5 11.5v9"></path><path d="M17 3.5c-1.4 1.6-2 3.6-2 5.6 0 1.5.7 2.4 2 2.4s2-.9 2-2.4c0-2-.6-4-2-5.6zM17 11.5v9"></path></svg>
      <div style="font-size: 12px; font-weight: 500; color: #5E6E96;">Dinner</div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#162150" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4c3.9 0 7 2.5 7 5.5H5C5 6.5 8.1 4 12 4z"></path><path d="M3.5 13h17M6 17h12"></path></svg>
      <div style="font-size: 12px; font-weight: 500; color: #5E6E96;">Snack</div>
    </div>
  </div>

  <!-- intake card -->
  <div style="margin: 26px 20px 0; padding: 18px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 8px 24px rgba(22,33,80,0.06);">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="flex-grow: 1; font-size: 18px; font-weight: 700; letter-spacing: -0.02em;">Today's Intake</div>
      <div style="flex-shrink: 0; height: 28px; padding: 0 12px; border-radius: 14px; background: #E7EDFE; display: flex; align-items: center; font-size: 12.5px; font-weight: 700; color: {{accent}};">742 kcal left</div>
    </div>

    <div style="display: flex; align-items: baseline; gap: 7px; margin-top: 14px;">
      <div style="font-size: 40px; font-weight: 800; letter-spacing: -0.04em; line-height: 1;">1,558</div>
      <div style="font-size: 14px; font-weight: 500; color: #7A88AB;">/ 2,300 kcal</div>
    </div>

    <div style="margin-top: 12px; height: 10px; border-radius: 5px; background: #E9EEF8; overflow: hidden;">
      <div style="width: 68%; height: 10px; border-radius: 5px; background: linear-gradient(90deg, {{accent}}, #A280F0);"></div>
    </div>

    <div style="display: flex; gap: 10px; margin-top: 18px;">
      <div style="flex-grow: 1;">
        <div style="display: flex; align-items: center; gap: 6px;">
          <div style="width: 8px; height: 8px; border-radius: 4px; background: #365DF5;"></div>
          <div style="font-size: 12px; font-weight: 500; color: #7A88AB;">Protein</div>
        </div>
        <div style="margin-top: 4px; font-size: 17px; font-weight: 700;">96 g</div>
      </div>
      <div style="flex-grow: 1;">
        <div style="display: flex; align-items: center; gap: 6px;">
          <div style="width: 8px; height: 8px; border-radius: 4px; background: #C9D48A;"></div>
          <div style="font-size: 12px; font-weight: 500; color: #7A88AB;">Carbs</div>
        </div>
        <div style="margin-top: 4px; font-size: 17px; font-weight: 700;">148 g</div>
      </div>
      <div style="flex-grow: 1;">
        <div style="display: flex; align-items: center; gap: 6px;">
          <div style="width: 8px; height: 8px; border-radius: 4px; background: #FA644C;"></div>
          <div style="font-size: 12px; font-weight: 500; color: #7A88AB;">Fat</div>
        </div>
        <div style="margin-top: 4px; font-size: 17px; font-weight: 700;">52 g</div>
      </div>
    </div>
  </div>

  <!-- recent -->
  <div style="display: flex; align-items: center; gap: 12px; margin: 22px 20px 0;">
    <div style="flex-grow: 1; font-size: 18px; font-weight: 700; letter-spacing: -0.02em;">Recent meals</div>
    <div style="font-size: 13px; font-weight: 600; color: {{accent}};">See all</div>
  </div>

  <div style="display: flex; align-items: flex-start; gap: 14px; margin: 12px 20px 0; padding: 12px; border-radius: 20px; background: #FFFFFF; box-shadow: 0 8px 24px rgba(22,33,80,0.06);">
    <div style="flex-shrink: 0; width: 52px; height: 52px; border-radius: 16px; overflow: hidden; background: #E7EDFE;">
      <svg viewBox="0 0 52 52" width="52" height="52">
        <circle cx="26" cy="30" r="17" fill="#365DF5"></circle>
        <ellipse cx="26" cy="24" rx="17" ry="6" fill="#FFF6E2"></ellipse>
        <circle cx="20" cy="23" r="4" fill="#FA644C"></circle>
        <path d="M27 20 C 33 17, 39 19, 41 23 C 35 26, 29 25, 27 20z" fill="#C9D48A"></path>
      </svg>
    </div>
    <div style="flex-grow: 1; padding-top: 4px;">
      <div style="font-size: 15.5px; font-weight: 700; letter-spacing: -0.015em;">Grilled Chicken Bowl</div>
      <div style="margin-top: 3px; font-size: 12.5px; font-weight: 500; color: #7A88AB;">Lunch &middot; 12:40 &middot; 380 g</div>
    </div>
    <div style="flex-shrink: 0; padding-top: 6px; font-size: 15px; font-weight: 800;">613</div>
  </div>

  <!-- bottom nav -->
  <div style="position: absolute; left: 20px; right: 20px; bottom: 22px; height: 68px; border-radius: 34px; background: #FFFFFF; box-shadow: 0 12px 30px rgba(22,33,80,0.14); display: flex; align-items: center; justify-content: space-between; padding: 0 10px;">
    <div style="height: 48px; padding: 0 18px; border-radius: 24px; background: #162150; display: flex; align-items: center; gap: 9px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V19a1 1 0 01-1 1h-4v-5h-6v5H5a1 1 0 01-1-1z"></path></svg>
      <div style="font-size: 14px; font-weight: 700; color: #FFFFFF;">Home</div>
    </div>
    <div style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8A96B6" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
    </div>
    <div style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8A96B6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="5"></rect><path d="M12 8.5v7M8.5 12h7"></path></svg>
    </div>
    <div style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8A96B6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V12M12 19V5M19 19v-9"></path></svg>
    </div>
    <div style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8A96B6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.8"></circle><path d="M4.8 20a7.4 7.4 0 0114.4 0"></path></svg>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#365DF5","options":["#365DF5","#162150","#FA644C","#6792FF"],"section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#365DF5' };
  }
}
</script>
</body>
</html>
