<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Poppins', 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #9CACFF; } a:hover { color: #FFFFFF; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #000000; color: #FFFFFF;">

  <div style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 24px 24px 0;">
    <div style="width: 34px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.3);"></div>
    <div style="flex-grow: 1; height: 3px; border-radius: 2px; background: #FFFFFF;"></div>
    <div style="width: 34px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.3);"></div>
  </div>

  <div style="margin: 32px 34px 0; text-align: center; font-size: 29px; font-weight: 600; line-height: 1.24; letter-spacing: -0.01em;">What's in your bowl?</div>

  <!-- stacked ingredient cards -->
  <div style="margin: 30px 22px 0;">

    <div style="position: relative; z-index: 1; height: 92px; padding: 18px 18px 0; box-sizing: border-box; border-radius: 24px; background: {{accent}}; color: #111111;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="flex-grow: 1; font-size: 20px; font-weight: 600;">Chicken breast</div>
        <div style="flex-shrink: 0; width: 40px; height: 40px; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; justify-content: center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"></path></svg>
        </div>
      </div>
    </div>

    <div style="position: relative; z-index: 2; margin-top: -16px; height: 92px; padding: 18px 18px 0; box-sizing: border-box; border-radius: 24px; background: #FFCC90; color: #111111;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="flex-grow: 1; font-size: 20px; font-weight: 600;">Brown rice</div>
        <div style="flex-shrink: 0; width: 40px; height: 40px; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; justify-content: center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"></path></svg>
        </div>
      </div>
    </div>

    <div style="position: relative; z-index: 3; margin-top: -16px; height: 92px; padding: 18px 18px 0; box-sizing: border-box; border-radius: 24px; background: #80D8B8; color: #111111;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="flex-grow: 1; font-size: 20px; font-weight: 600;">Avocado</div>
        <div style="flex-shrink: 0; width: 40px; height: 40px; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; justify-content: center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"></path></svg>
        </div>
      </div>
    </div>

    <div style="position: relative; z-index: 4; margin-top: -16px; padding: 18px; border-radius: 24px; background: #F894C4; color: #111111;">
      <div style="font-size: 20px; font-weight: 600;">Olive oil dressing</div>
      <div style="margin-top: 8px; font-size: 13.5px; font-weight: 400; line-height: 1.5; max-width: 250px;">A 10 g drizzle carries 88 kcal — the smallest thing on the plate and a seventh of the meal.</div>
      <div style="display: flex; align-items: center; gap: 12px; margin-top: 16px;">
        <div style="height: 32px; padding: 0 14px; border-radius: 16px; background: rgba(17,17,17,0.14); display: flex; align-items: center; font-size: 13px; font-weight: 600;">88 kcal</div>
        <div style="flex-grow: 1;"></div>
        <div style="flex-shrink: 0; width: 40px; height: 40px; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; justify-content: center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"></path></svg>
        </div>
      </div>
    </div>

  </div>

  <div style="margin: 26px 24px 0; text-align: center; font-size: 14px; font-weight: 400; color: #8A8A8A;">Grilled Chicken Bowl &middot; 380 g &middot; 613 kcal</div>

  <!-- actions -->
  <div style="position: absolute; left: 24px; right: 24px; bottom: 40px; display: flex; align-items: center; gap: 12px;">
    <div style="font-size: 15px; font-weight: 500; color: #FFFFFF;">Edit</div>
    <div style="flex-grow: 1;"></div>
    <div style="display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 26px; border-radius: 28px; background: #FFFFFF;">
      <div style="font-size: 15.5px; font-weight: 500; color: #111111;">Log again</div>
      <svg width="26" height="12" viewBox="0 0 26 12" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l4 4-4 4M10 2l4 4-4 4M18 2l4 4-4 4"></path></svg>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#9CACFF","options":["#9CACFF","#FFCC90","#80D8B8","#F894C4"],"section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#9CACFF' };
  }
}
</script>
</body>
</html>
