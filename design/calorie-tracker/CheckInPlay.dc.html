<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Poppins', 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #111111; } a:hover { color: #E06A48; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: {{accent}}; color: #111111;">

  <!-- step bars -->
  <div style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 24px 24px 0;">
    <div style="width: 34px; height: 3px; border-radius: 2px; background: rgba(17,17,17,0.26);"></div>
    <div style="flex-grow: 1; height: 3px; border-radius: 2px; background: #111111;"></div>
    <div style="width: 34px; height: 3px; border-radius: 2px; background: rgba(17,17,17,0.26);"></div>
  </div>

  <div style="margin: 34px 34px 0; text-align: center; font-size: 24px; font-weight: 600; line-height: 1.3; letter-spacing: -0.005em;">Anna, how full are you feeling?</div>

  <!-- face -->
  <div style="display: flex; justify-content: center; margin-top: 22px;">
    <svg viewBox="0 0 300 330" width="300" height="330">
      <g stroke="#111111" stroke-width="4.5" stroke-linecap="round">
        <path d="M74 34 L64 12"></path>
        <path d="M96 28 L92 4"></path>
        <path d="M118 34 L128 12"></path>
        <path d="M182 34 L172 12"></path>
        <path d="M204 28 L208 4"></path>
        <path d="M226 34 L236 12"></path>
      </g>
      <path d="M56 108 C 56 60, 140 60, 140 108 C 140 156, 118 194, 82 204 C 64 182, 56 144, 56 108 z" fill="#FFFFFF" stroke="#111111" stroke-width="5" stroke-linejoin="round"></path>
      <path d="M244 108 C 244 60, 160 60, 160 108 C 160 156, 182 194, 218 204 C 236 182, 244 144, 244 108 z" fill="#FFFFFF" stroke="#111111" stroke-width="5" stroke-linejoin="round"></path>
      <ellipse cx="98" cy="118" rx="25" ry="33" fill="#111111"></ellipse>
      <ellipse cx="202" cy="118" rx="25" ry="33" fill="#111111"></ellipse>
      <circle cx="107" cy="100" r="8" fill="#FFFFFF"></circle>
      <circle cx="211" cy="100" r="8" fill="#FFFFFF"></circle>
      <ellipse cx="40" cy="236" rx="34" ry="14" fill="#E06A48" transform="rotate(-10 40 236)"></ellipse>
      <ellipse cx="260" cy="236" rx="34" ry="14" fill="#E06A48" transform="rotate(10 260 236)"></ellipse>
      <path d="M116 242 Q 150 282 184 242" fill="none" stroke="#111111" stroke-width="5" stroke-linecap="round"></path>
    </svg>
  </div>

  <!-- label -->
  <div style="margin-top: 34px; text-align: center; font-size: 13.5px; font-weight: 400;">I'm feeling</div>
  <div style="margin-top: 2px; text-align: center; font-size: 19px; font-weight: 600;">Satisfied</div>

  <!-- tick slider -->
  <div style="display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 40px; padding: 0 26px;">
    <div style="width: 2px; height: 16px; border-radius: 1px; background: #FFFFFF;"></div>
    <div style="width: 2px; height: 16px; border-radius: 1px; background: #FFFFFF;"></div>
    <div style="width: 2px; height: 16px; border-radius: 1px; background: #FFFFFF;"></div>
    <div style="width: 2px; height: 16px; border-radius: 1px; background: #FFFFFF;"></div>
    <div style="width: 2px; height: 16px; border-radius: 1px; background: #FFFFFF;"></div>
    <div style="width: 46px; height: 46px; border-radius: 23px; background: #FFFFFF; display: flex; align-items: center; justify-content: center;">
      <div style="width: 16px; height: 16px; border-radius: 8px; background: #111111;"></div>
    </div>
    <div style="width: 2px; height: 16px; border-radius: 1px; background: #FFFFFF;"></div>
    <div style="width: 2px; height: 16px; border-radius: 1px; background: #FFFFFF;"></div>
    <div style="width: 2px; height: 16px; border-radius: 1px; background: #FFFFFF;"></div>
    <div style="width: 2px; height: 16px; border-radius: 1px; background: #FFFFFF;"></div>
    <div style="width: 2px; height: 16px; border-radius: 1px; background: #FFFFFF;"></div>
  </div>

  <!-- actions -->
  <div style="position: absolute; left: 24px; right: 24px; bottom: 40px; display: flex; align-items: center; gap: 12px;">
    <div style="font-size: 15px; font-weight: 500;">Skip</div>
    <div style="flex-grow: 1;"></div>
    <div style="display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 26px; border-radius: 28px; background: #111111;">
      <div style="font-size: 15.5px; font-weight: 500; color: #FFFFFF;">Next</div>
      <svg width="26" height="12" viewBox="0 0 26 12" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l4 4-4 4M10 2l4 4-4 4M18 2l4 4-4 4"></path></svg>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#FFCC90","options":["#FFCC90","#9CACFF","#80D8B8","#F894C4"],"section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FFCC90' };
  }
}
</script>
</body>
</html>
