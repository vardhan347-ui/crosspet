<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&amp;family=Manrope:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Manrope', 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #B18BE0; } a:hover { color: #D7C4F2; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: linear-gradient(168deg, #251E33 0%, #1B1628 48%, #131020 100%); color: #F2EEF9;">

  <!-- header -->
  <div style="display: flex; align-items: center; gap: 12px; padding: 26px 22px 0;">
    <div style="width: 52px; height: 52px; border-radius: 26px; background: linear-gradient(150deg, #d9c6e6, #a882c4); display: flex; align-items: center; justify-content: center; font-family: 'Schibsted Grotesk', 'Helvetica Neue', sans-serif; font-weight: 600; font-size: 19px; color: #fdfbff;">A</div>
    <div style="flex-grow: 1;"></div>
    <div style="width: 48px; height: 48px; border-radius: 24px; background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.09); display: flex; align-items: center; justify-content: center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#F2EEF9" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
    </div>
    <div style="width: 48px; height: 48px; border-radius: 24px; background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.09); display: flex; align-items: center; justify-content: center; gap: 3px;">
      <div style="width: 3.5px; height: 3.5px; border-radius: 2px; background: #F2EEF9;"></div>
      <div style="width: 3.5px; height: 3.5px; border-radius: 2px; background: #F2EEF9;"></div>
      <div style="width: 3.5px; height: 3.5px; border-radius: 2px; background: #F2EEF9;"></div>
    </div>
  </div>

  <!-- greeting + title -->
  <div style="padding: 24px 22px 0;">
    <div style="font-size: 15px; font-weight: 500; color: #A79FB8; letter-spacing: -0.01em;">Hello, Anna</div>
    <div style="margin-top: 6px; font-family: 'Schibsted Grotesk', 'Helvetica Neue', sans-serif; font-size: 40px; font-weight: 700; line-height: 0.98; letter-spacing: -0.035em; max-width: 250px;">Your Daily Intake</div>
  </div>

  <!-- filter chips -->
  <div style="display: flex; align-items: center; gap: 10px; margin-top: 20px; padding-left: 22px; overflow: hidden;">
    <div style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.09); display: flex; align-items: center; justify-content: center;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#F2EEF9" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"></path></svg>
    </div>
    <div style="flex-shrink: 0; height: 44px; padding: 0 16px; border-radius: 22px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.09); display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 500;">
      Breakfast
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#9C94AE" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </div>
    <div style="flex-shrink: 0; height: 44px; padding: 0 16px; border-radius: 22px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.09); display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 500;">
      Lunch
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#9C94AE" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </div>
    <div style="flex-shrink: 0; height: 44px; padding: 0 16px; border-radius: 22px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.09); display: flex; align-items: center; font-size: 14px; font-weight: 500;">Dinne</div>
  </div>

  <!-- main card -->
  <div style="margin: 18px 22px 0; padding: 20px; border-radius: 28px; background: linear-gradient(155deg, rgba(74,62,101,0.95), rgba(58,47,82,0.95)); border: 1px solid rgba(255,255,255,0.11);">
    <div style="display: flex; align-items: flex-start; gap: 12px;">
      <div style="flex-grow: 1; font-family: 'Schibsted Grotesk', 'Helvetica Neue', sans-serif; font-size: 23px; font-weight: 600; letter-spacing: -0.025em;">Calorie Balance</div>
      <div style="flex-shrink: 0; width: 32px; height: 32px; border-radius: 16px; background: rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: center; gap: 3px;">
        <div style="width: 3px; height: 3px; border-radius: 2px; background: #B7AEC8;"></div>
        <div style="width: 3px; height: 3px; border-radius: 2px; background: #B7AEC8;"></div>
        <div style="width: 3px; height: 3px; border-radius: 2px; background: #B7AEC8;"></div>
      </div>
    </div>
    <div style="margin-top: 7px; font-size: 13.5px; line-height: 1.35; color: rgba(242,238,249,0.62); max-width: 262px; text-wrap: pretty;">Meals, water and activity in one place.</div>

    <!-- stats + art -->
    <div style="position: relative; margin-top: 16px; height: 186px; border-radius: 22px; overflow: hidden; background: linear-gradient(150deg, rgba(255,255,255,0.08), rgba(255,255,255,0.06));">
      <svg viewBox="0 0 210 190" width="216" height="196" style="position: absolute; right: -18px; top: 2px;">
        <defs>
          <radialGradient id="hVio" cx="34%" cy="26%" r="76%">
            <stop offset="0" stop-color="#e6c8f7"></stop><stop offset="45%" stop-color="#9a5fcd"></stop><stop offset="100%" stop-color="#43195f"></stop>
          </radialGradient>
          <radialGradient id="hMag" cx="34%" cy="24%" r="78%">
            <stop offset="0" stop-color="#fbd6e5"></stop><stop offset="44%" stop-color="#d4779f"></stop><stop offset="100%" stop-color="#8a2b58"></stop>
          </radialGradient>
          <radialGradient id="hPink" cx="35%" cy="28%" r="76%">
            <stop offset="0" stop-color="#fde4ea"></stop><stop offset="52%" stop-color="#e39fb4"></stop><stop offset="100%" stop-color="#b25f7f"></stop>
          </radialGradient>
          <linearGradient id="hTube" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffffff"></stop><stop offset="38%" stop-color="#bdb6c8"></stop><stop offset="62%" stop-color="#f4f2f6"></stop><stop offset="100%" stop-color="#a49dae"></stop>
          </linearGradient>
        </defs>
        <ellipse cx="112" cy="168" rx="72" ry="12" fill="#6b4a80" opacity="0.14"></ellipse>
        <circle cx="72" cy="112" r="42" fill="url(#hVio)"></circle>
        <path d="M18 66 C 58 18, 118 148, 196 92" fill="none" stroke="url(#hTube)" stroke-width="21" stroke-linecap="round" opacity="0.95"></path>
        <circle cx="132" cy="68" r="50" fill="url(#hMag)"></circle>
        <ellipse cx="115" cy="46" rx="17" ry="11" fill="#ffffff" opacity="0.4" transform="rotate(-24 115 46)"></ellipse>
        <circle cx="150" cy="132" r="27" fill="url(#hPink)"></circle>
      </svg>

      <div style="position: relative; display: flex; flex-direction: column; gap: 14px; padding: 18px;">
        <div>
          <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: rgba(242,238,249,0.5);">Eaten</div>
          <div style="font-family: 'Schibsted Grotesk', 'Helvetica Neue', sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -0.04em; line-height: 1;">1,558</div>
        </div>
        <div>
          <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: rgba(242,238,249,0.5);">Burned</div>
          <div style="font-family: 'Schibsted Grotesk', 'Helvetica Neue', sans-serif; font-size: 27px; font-weight: 700; letter-spacing: -0.04em; line-height: 1;">420</div>
        </div>
        <div style="display: flex; align-items: center; gap: 7px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(242,238,249,0.55)" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>
          <div style="font-size: 12.5px; font-weight: 500; color: rgba(242,238,249,0.66);">742 kcal left</div>
        </div>
      </div>

      <div style="position: absolute; right: 14px; bottom: 14px; width: 44px; height: 44px; border-radius: 22px; background: #F2EEF9; display: flex; align-items: center; justify-content: center;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#17141C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"></path></svg>
      </div>
    </div>
  </div>

  <!-- macro row -->
  <div style="display: flex; align-items: center; gap: 14px; margin: 12px 22px 0; padding: 14px 16px; border-radius: 24px; background: linear-gradient(140deg, rgba(86,53,64,0.95), rgba(70,42,52,0.95)); border: 1px solid rgba(255,255,255,0.11);">
    <div style="flex-shrink: 0; width: 46px; height: 46px; border-radius: 23px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#EBA9BA" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5v6a3 3 0 006 0v-6M9.5 9.5V20.5"></path><path d="M17.5 3.5c-1.6 1.4-2.2 3.4-2.2 5.5 0 1.6.7 2.6 2.2 2.6s2.2-1 2.2-2.6c0-2.1-.6-4.1-2.2-5.5zM17.5 11.6V20.5"></path></svg>
    </div>
    <div style="flex-grow: 1;">
      <div style="font-family: 'Schibsted Grotesk', 'Helvetica Neue', sans-serif; font-size: 17px; font-weight: 600; letter-spacing: -0.02em;">Protein 96 g</div>
      <div style="margin-top: 3px; font-size: 12.5px; color: rgba(255,235,240,0.66);">74% of today's 130 g target</div>
      <div style="margin-top: 8px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.07); overflow: hidden;">
        <div style="width: 74%; height: 5px; border-radius: 3px; background: {{accent}};"></div>
      </div>
    </div>
  </div>

  <!-- peeking card -->
  <div style="display: flex; align-items: flex-start; gap: 14px; margin: 10px 22px 0; padding: 14px 16px; border-radius: 24px; background: rgba(48,59,49,0.92); border: 1px solid rgba(255,255,255,0.11);">
    <div style="flex-shrink: 0; width: 46px; height: 46px; border-radius: 23px; background: rgba(255,255,255,0.09); display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A3CBAA" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5s6 6.2 6 10.2a6 6 0 01-12 0C6 9.7 12 3.5 12 3.5z"></path></svg>
    </div>
    <div style="flex-grow: 1; padding-top: 3px; font-family: 'Schibsted Grotesk', 'Helvetica Neue', sans-serif; font-size: 17px; font-weight: 600; letter-spacing: -0.02em;">Water</div>
    <div style="flex-shrink: 0; padding-top: 4px; font-size: 14px; font-weight: 500; color: rgba(232,245,234,0.7);">1.4 / 2.2 L</div>
  </div>

  <!-- bottom nav -->
  <div style="position: absolute; left: 22px; right: 22px; bottom: 22px; height: 68px; border-radius: 34px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.11); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: 0 14px 34px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: space-around; padding: 0 10px;">
    <div style="width: 52px; height: 52px; border-radius: 26px; background: rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#B7AEC8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V19a1 1 0 01-1 1h-4v-5h-6v5H5a1 1 0 01-1-1z"></path></svg>
    </div>
    <div style="width: 88px; height: 52px; border-radius: 26px; background: #F2EEF9; display: flex; align-items: center; justify-content: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#17141C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"></rect><path d="M8.5 9.5h7M8.5 14h4.5"></path></svg>
    </div>
    <div style="width: 52px; height: 52px; border-radius: 26px; background: rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#B7AEC8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3.5"></rect><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"></path></svg>
    </div>
    <div style="width: 52px; height: 52px; border-radius: 26px; background: rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#B7AEC8" stroke-width="1.7" stroke-linecap="round"><circle cx="8" cy="8" r="3"></circle><circle cx="16" cy="8" r="3"></circle><circle cx="8" cy="16" r="3"></circle><circle cx="16" cy="16" r="3"></circle></svg>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#B18BE0","options":["#B18BE0","#E086AE","#7FA6E0","#68C79E"],"section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#B18BE0' };
  }
}
</script>
</body>
</html>
