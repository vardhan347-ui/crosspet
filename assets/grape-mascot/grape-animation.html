<script>
(() => {
  "use strict";

  // ---- stage constants (SVG user units) --------------------------------
  const T       = 2.6;              // loop length in seconds
  const GROUND  = 1085;             // y where the feet rest
  const PIVOT   = [655, 905];       // body pivot: base of the blob
  const STEM    = [726, 318];       // where the leaf joins the body
  const HIP     = [[560, 872], [758, 876]];   // leg attach points on the body
  const FOOT    = [[515, 1040], [787, 1043]]; // planted foot centres

  const $ = (id) => document.getElementById(id);
  const el = {
    stage: $("stage"), shadow: $("shadow"), leafShadow: $("leafShadow"), dust: $("dust"),
    charRoot: $("charRoot"), charBody: $("charBody"), armL: $("armL"), armR: $("armR"),
    legL: $("legL"), legR: $("legR"), footL: $("footL"), footR: $("footR"),
    eyeL: $("eyeL"), eyeR: $("eyeR"), glintL: $("glintL"), glintR: $("glintR"),
    mouth: $("mouth"), mouthClipPath: $("mouthClipPath"), tongue: $("tongue"),
    leafGroup: $("leafGroup"),
  };

  // ---- small maths helpers ---------------------------------------------
  const clamp  = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp   = (a, b, u) => a + (b - a) * u;
  const smooth = (u) => u * u * (3 - 2 * u);
  const easeOut  = (u) => 1 - Math.pow(1 - u, 3);
  const easeIn   = (u) => u * u * u;
  const easeOutBack = (u) => { const c = 1.9; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
  // normalised progress through [a,b]; NaN-free outside the window
  const span = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
  const inSpan = (t, a, b) => t >= a && t < b;
  const arch = (u) => Math.sin(Math.PI * clamp(u, 0, 1));   // 0 -> 1 -> 0

  // ---- timeline ---------------------------------------------------------
  // idle hop, idle hop, crouch, big jump (leaf pops off), land, shock, leaf back on
  const P = {
    idle1: [0.00, 0.55], idle2: [0.55, 1.05], antic: [1.05, 1.22],
    jump:  [1.22, 1.70], land:  [1.70, 1.88], react: [1.88, 2.16],
    hold:  [2.16, 2.38], back:  [2.38, 2.60],
  };
  const T_DETACH  = 1.44;   // leaf lets go just past the apex
  const T_LEAFHIT = 1.90;   // leaf touches the ground
  const BLADE_C   = [880, 178];   // centre of the leaf blade in local coords
  const LEAF_REST = [1065, 1046]; // where the blade comes to rest on the floor
  const LEAF_RESTROT = 104;       // lying on its side

  // decaying bounce used for landing squash
  const bounce = (u, amp, decay, freq) => amp * Math.exp(-decay * u) * Math.cos(freq * u);

  function idleHop(u, h) {
    // crouch -> airborne -> land, all inside one idle beat
    let y = 0, sy = 1;
    if (u < 0.22) {
      sy = 1 - 0.085 * smooth(u / 0.22);
    } else if (u < 0.74) {
      const v = (u - 0.22) / 0.52;
      y  = -h * arch(v);
      sy = 1 + 0.075 * arch(v) - 0.085 * (1 - smooth(clamp(v * 3, 0, 1)));
    } else {
      const v = (u - 0.74) / 0.26;
      sy = 1 - bounce(v, 0.13, 4.2, 9.5);
    }
    return { y, sy };
  }

  // full character state for a given time
  function state(t) {
    t = ((t % T) + T) % T;
    const s = {
      hopY: 0, sx: 1, sy: 1, tilt: 0, dx: 0,
      armL: 0, armR: 0,
      blink: 0, shock: 0, eyeDx: 0, eyeDy: 0,
      mouth: 0,                       // 0 = smile, 1 = wide "oh no"
      leafAttached: true, leafWobble: 0,
      leafPos: [0, 0], leafRot: 0, leafScale: 1,
    };

    // ---- body: hops, crouch, jump, landing --------------------------------
    if (inSpan(t, ...P.idle1) || inSpan(t, ...P.idle2)) {
      const [a, b] = inSpan(t, ...P.idle1) ? P.idle1 : P.idle2;
      const hop = idleHop(span(t, a, b), 74);
      s.hopY = hop.y; s.sy = hop.sy;
      s.mouth = 0.22 * arch(span(t, a, b));
    } else if (inSpan(t, ...P.antic)) {
      const u = span(t, ...P.antic);
      s.sy = 1 - 0.17 * smooth(u);          // deep crouch before the big one
      s.hopY = 6 * smooth(u);
      s.mouth = 0.25 * u;
    } else if (inSpan(t, ...P.jump)) {
      const u = span(t, ...P.jump);
      s.hopY = -245 * arch(Math.pow(u, 0.92));
      s.sy = 1 + 0.16 * Math.sin(Math.PI * Math.pow(u, 0.7)) - 0.09 * (1 - smooth(clamp(u * 4, 0, 1)));
      s.mouth = lerp(0.25, 1, smooth(clamp(u * 2.4, 0, 1)));
    } else if (inSpan(t, ...P.land)) {
      const u = span(t, ...P.land);
      s.sy = 1 - bounce(u, 0.24, 3.6, 9.0);
      s.mouth = 1;
    } else {
      // reaction / hold / leaf back on: small shivers, then settle
      const u = span(t, P.react[0], P.back[1]);
      s.sy = 1 - bounce(span(t, ...P.react), 0.05, 5.0, 11.0);
      s.tilt += 1.6 * Math.sin(t * 46) * Math.exp(-3.2 * span(t, P.react[0], P.react[1]));
      s.tilt += 3.0 * smooth(span(t, P.react[0] + 0.10, P.react[0] + 0.26))
                    * (1 - smooth(span(t, P.back[0], P.back[0] + 0.12)));   // lean at the leaf
      s.sy += 0.016 * Math.sin((t - P.react[0]) * 8.4);                     // breathing
      s.dx = 4 * Math.sin(t * 52) * Math.exp(-3.0 * span(t, P.react[0], P.react[1]));
      s.mouth = inSpan(t, ...P.back) ? lerp(1, 0, smooth(span(t, P.back[0] + 0.06, P.back[1] - 0.02))) : 1;
      if (inSpan(t, ...P.back)) {
        // little squash as the leaf pops back on
        s.sy += 0.07 * arch(span(t, P.back[0] + 0.10, P.back[1]));
      }
      void u;
    }
    s.sx = 1 + (1 - s.sy) * 0.85;
    s.tilt += 2.4 * Math.sin((t / T) * Math.PI * 4);   // lazy side-to-side sway

    // ---- arms --------------------------------------------------------------
    const swing = 13 * Math.sin((t / T) * Math.PI * 4 + 0.6);
    s.armL = swing; s.armR = -swing;
    if (inSpan(t, ...P.antic)) {
      const u = smooth(span(t, ...P.antic));
      s.armL = lerp(s.armL, -18, u); s.armR = lerp(s.armR, 18, u);   // wind up, arms tucked back
    } else if (inSpan(t, ...P.jump)) {
      const u = arch(span(t, ...P.jump));
      s.armL = lerp(swing, 58, u); s.armR = lerp(-swing, -58, u);    // flung up
    } else if (t >= P.land[0]) {
      const u = smooth(span(t, P.land[0], P.land[0] + 0.14));
      const flail = 9 * Math.sin(t * 40) * Math.exp(-3 * span(t, P.land[0], P.hold[1]));
      s.armL = lerp(58, 34 + flail, u); s.armR = lerp(-58, -34 - flail, u);
      if (inSpan(t, ...P.back)) {
        const v = smooth(span(t, P.back[0], P.back[1]));
        s.armL = lerp(s.armL, swing, v); s.armR = lerp(s.armR, -swing, v);
      }
    }

    // ---- face --------------------------------------------------------------
    const blinkAt = (t0) => arch(span(t, t0, t0 + 0.14));
    s.blink = Math.max(blinkAt(0.30), blinkAt(0.84));
    if (t >= T_DETACH && t < P.back[1] - 0.04) {
      s.shock = smooth(span(t, T_DETACH, T_DETACH + 0.18));
      if (t > P.back[0] + 0.08) s.shock *= 1 - smooth(span(t, P.back[0] + 0.08, P.back[1] - 0.04));
      s.blink = 0;
    }
    if (t >= T_LEAFHIT && t < P.back[0] + 0.06) {
      // glance down at the leaf lying on the floor
      const u = smooth(span(t, T_LEAFHIT, T_LEAFHIT + 0.16));
      s.eyeDx = 11 * u; s.eyeDy = 9 * u;
    }

    // ---- leaf --------------------------------------------------------------
    s.leafWobble = 6 * Math.sin((t / T) * Math.PI * 4.8 + 0.4);
    if (t >= T_DETACH && t < P.back[1] - 0.005) {
      s.leafAttached = false;
      const at = state(T_DETACH - 0.001);            // pose at the moment it lets go
      const start = bodyPoint(BLADE_C, at);
      let target, rot, scale;
      if (t < T_LEAFHIT) {
        const u = span(t, T_DETACH, T_LEAFHIT);
        target = [lerp(start[0], LEAF_REST[0], easeOut(u)),
                  lerp(start[1], LEAF_REST[1], easeIn(u)) - 120 * arch(u)];
        rot = lerp(0, LEAF_RESTROT, easeOut(u)) + 34 * Math.sin(u * 9.5);
        scale = lerp(1, 0.94, u);
      } else if (t < P.back[0]) {
        const u = span(t, T_LEAFHIT, T_LEAFHIT + 0.24);
        target = [LEAF_REST[0], LEAF_REST[1] - 34 * arch(u) * Math.exp(-2.2 * u)];
        rot = LEAF_RESTROT + bounce(u, 9, 4.5, 10);
        scale = 0.94;
      } else {
        // springs back onto the head for a seamless loop
        const u = smooth(span(t, P.back[0], P.back[1] - 0.005));
        target = [lerp(LEAF_REST[0], BLADE_C[0], u),
                  lerp(LEAF_REST[1], BLADE_C[1], easeOutBack(u)) - 130 * arch(u)];
        rot = lerp(LEAF_RESTROT - 360, 0, u);
        scale = lerp(0.94, 1, u);
      }
      s.leafRot = rot; s.leafScale = scale;
      s.leafPos = leafOffset(target, rot, scale);
    }
    return s;
  }

  // body transform, as an SVG transform list
  function bodyTransform(s) {
    return `translate(${s.dx.toFixed(2)},${s.hopY.toFixed(2)}) ` +
           `translate(${PIVOT[0]},${PIVOT[1]}) rotate(${s.tilt.toFixed(3)}) ` +
           `scale(${s.sx.toFixed(4)},${s.sy.toFixed(4)}) translate(${-PIVOT[0]},${-PIVOT[1]})`;
  }

  // a body-local point in world space for a given state
  function bodyPoint(p, s) {
    const r = s.tilt * Math.PI / 180;
    const px = (p[0] - PIVOT[0]) * s.sx, py = (p[1] - PIVOT[1]) * s.sy;
    return [
      PIVOT[0] + px * Math.cos(r) - py * Math.sin(r) + s.dx,
      PIVOT[1] + px * Math.sin(r) + py * Math.cos(r) + s.hopY,
    ];
  }

  // translate needed so the blade centre lands on `target` after rotate+scale about STEM
  function leafOffset(target, rotDeg, scale) {
    const r = rotDeg * Math.PI / 180;
    const vx = (BLADE_C[0] - STEM[0]) * scale, vy = (BLADE_C[1] - STEM[1]) * scale;
    const bx = STEM[0] + vx * Math.cos(r) - vy * Math.sin(r);
    const by = STEM[1] + vx * Math.sin(r) + vy * Math.cos(r);
    return [target[0] - bx, target[1] - by];
  }

  // mouth shape: flat-topped smile (o=0) morphing into a wide oval (o=1)
  function mouthPath(o) {
    const w = lerp(127, 112, o), h = lerp(58, 122, o);
    const cx = 655, top = lerp(669, 662, o);
    const topCurve = lerp(0, 0.62, o);
    const hw = w / 2;
    return `M${cx - hw},${top} C${cx - hw},${top - topCurve * h * 0.62} ${cx + hw},${top - topCurve * h * 0.62} ${cx + hw},${top} ` +
           `C${cx + hw},${top + h * 0.98} ${cx - hw},${top + h * 0.98} ${cx - hw},${top} Z`;
  }

  // ---- dust puffs kicked up on landing ----------------------------------
  const PUFFS = [
    { t0: P.land[0],  x: 470, y: GROUND - 8, vx: -150, vy: -34, r: 26 },
    { t0: P.land[0] + 0.03, x: 560, y: GROUND - 2, vx: -96, vy: -20, r: 18 },
    { t0: P.land[0],  x: 840, y: GROUND - 8, vx: 155, vy: -36, r: 26 },
    { t0: P.land[0] + 0.03, x: 760, y: GROUND - 2, vx: 92, vy: -18, r: 18 },
    { t0: T_LEAFHIT, x: 930, y: GROUND - 4, vx: -105, vy: -26, r: 15 },
    { t0: T_LEAFHIT + 0.02, x: 1035, y: GROUND - 4, vx: 105, vy: -24, r: 13 },
  ];
  const puffNodes = PUFFS.map(() => {
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("fill", "#7a5bb5");
    el.dust.appendChild(c);
    return c;
  });

  // ---- draw one frame ---------------------------------------------------
  function render(t) {
    const s = state(t);
    const bt = bodyTransform(s);
    el.charRoot.setAttribute("transform", "");
    el.charBody.setAttribute("transform", bt);

    el.armL.setAttribute("transform", `rotate(${s.armL.toFixed(2)} 396 744)`);
    el.armR.setAttribute("transform", `rotate(${s.armR.toFixed(2)} 936 764)`);

    // legs: hips ride the body, feet stay on the ground unless airborne
    const lift = Math.max(0, -s.hopY);
    const airborne = clamp(lift / 90, 0, 1);
    for (let i = 0; i < 2; i++) {
      const hip = { x: HIP[i][0], y: HIP[i][1] };
      const r = s.tilt * Math.PI / 180;
      const px = (hip.x - PIVOT[0]) * s.sx, py = (hip.y - PIVOT[1]) * s.sy;
      const hx = PIVOT[0] + px * Math.cos(r) - py * Math.sin(r) + s.dx;
      const hy = PIVOT[1] + px * Math.sin(r) + py * Math.cos(r) + s.hopY;
      // feet tuck up and inward while in the air
      const tuck = airborne * 74;
      const fx = lerp(FOOT[i][0], lerp(FOOT[i][0], 655, 0.34), airborne) + s.dx * 0.4;
      const fy = FOOT[i][1] - lift * 1.0 - tuck * 0.42;
      const ax = lerp(hx, fx, 0.55) + (i === 0 ? -14 : 14) * (1 - airborne);
      const ay = lerp(hy, fy, 0.62);
      (i === 0 ? el.legL : el.legR).setAttribute("d", `M${hx.toFixed(1)},${hy.toFixed(1)} Q${ax.toFixed(1)},${ay.toFixed(1)} ${fx.toFixed(1)},${(fy - 12).toFixed(1)}`);
      const foot = i === 0 ? el.footL : el.footR;
      foot.setAttribute("cx", fx.toFixed(1));
      foot.setAttribute("cy", fy.toFixed(1));
      foot.setAttribute("transform", `rotate(${(i === 0 ? -8 : 8) - airborne * (i === 0 ? 22 : -22)} ${fx.toFixed(1)} ${fy.toFixed(1)})`);
    }

    // eyes: blink squeeze, shock widen, glance at the fallen leaf
    const rx = lerp(35, 41, s.shock), ry = lerp(37, 48, s.shock) * lerp(1, 0.07, s.blink);
    for (const [eye, glint, cx] of [[el.eyeL, el.glintL, 575], [el.eyeR, el.glintR, 740]]) {
      eye.setAttribute("cx", (cx + s.eyeDx).toFixed(1));
      eye.setAttribute("cy", (621 + s.eyeDy).toFixed(1));
      eye.setAttribute("rx", rx.toFixed(1));
      eye.setAttribute("ry", ry.toFixed(1));
      glint.setAttribute("cx", (cx - 12 + s.eyeDx).toFixed(1));
      glint.setAttribute("cy", (606 + s.eyeDy - s.shock * 6).toFixed(1));
      glint.setAttribute("r", (9 * lerp(1, 0.1, s.blink)).toFixed(1));
    }

    const d = mouthPath(s.mouth);
    el.mouth.setAttribute("d", d);
    el.mouthClipPath.setAttribute("d", d);
    const mw = lerp(127, 112, s.mouth), mh = lerp(58, 122, s.mouth), mtop = lerp(669, 662, s.mouth);
    el.tongue.setAttribute("cx", 655);
    el.tongue.setAttribute("cy", (mtop + mh * 0.78).toFixed(1));
    el.tongue.setAttribute("rx", (mw * 0.31).toFixed(1));
    el.tongue.setAttribute("ry", (mh * 0.26).toFixed(1));

    // leaf: rides the head, or lives in world space once it drops
    if (s.leafAttached) {
      el.leafGroup.setAttribute("transform", `${bt} rotate(${s.leafWobble.toFixed(2)} ${STEM[0]} ${STEM[1]})`);
    } else {
      el.leafGroup.setAttribute("transform",
        `translate(${s.leafPos[0].toFixed(1)},${s.leafPos[1].toFixed(1)}) ` +
        `translate(${STEM[0]},${STEM[1]}) rotate(${s.leafRot.toFixed(2)}) scale(${s.leafScale.toFixed(3)}) ` +
        `translate(${-STEM[0]},${-STEM[1]})`);
    }

    // shadows shrink as the character leaves the ground
    const shrink = clamp(lift / 245, 0, 1);
    el.shadow.setAttribute("rx", (250 * s.sx * lerp(1, 0.55, shrink)).toFixed(1));
    el.shadow.setAttribute("ry", (42 * lerp(1, 0.62, shrink)).toFixed(1));
    el.shadow.setAttribute("cx", (655 + s.dx).toFixed(1));
    el.shadow.setAttribute("opacity", lerp(1, 0.45, shrink).toFixed(3));

    const tt = ((t % T) + T) % T;
    const leafDown = tt >= T_LEAFHIT && tt < P.back[0] + 0.10;
    el.leafShadow.setAttribute("opacity", leafDown
      ? (0.9 * smooth(span(tt, T_LEAFHIT, T_LEAFHIT + 0.1)) * (1 - smooth(span(tt, P.back[0], P.back[0] + 0.10)))).toFixed(3)
      : "0");

    // dust
    PUFFS.forEach((p, i) => {
      const age = tt - p.t0;
      const n = puffNodes[i];
      if (age < 0 || age > 0.5) { n.setAttribute("opacity", "0"); return; }
      const u = age / 0.5;
      n.setAttribute("cx", (p.x + p.vx * u).toFixed(1));
      n.setAttribute("cy", (p.y + p.vy * u + 120 * u * u).toFixed(1));
      n.setAttribute("r", (p.r * lerp(0.5, 1.25, u)).toFixed(1));
      n.setAttribute("opacity", (0.34 * (1 - u) * (1 - u)).toFixed(3));
    });
  }

  // ---- playback ---------------------------------------------------------
  const params = new URLSearchParams(location.search);
  const bg = params.get("bg");
  if (bg === "dark" || bg === "black") document.body.classList.add("bg-dark");
  if (bg === "none" || bg === "transparent") document.body.classList.add("bg-none");

  let paused = params.has("frame");
  const t0 = performance.now();
  function tick(now) {
    if (!paused) render((now - t0) / 1000);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // deterministic hooks used by the frame exporter
  window.grapeAnim = {
    duration: T,
    setTime(t) { paused = true; render(t); },
    play() { paused = false; },
  };
  render(params.has("frame") ? parseFloat(params.get("frame")) : 0);
})();
</script>
</body>
</html>
